<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khianne Ed Miguel P. Orteza</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#ffffff;
    --ink:#171717;
    --muted:#767676;
    --line: rgba(23,23,23,0.10);
    --accent: rgba(23,23,23,0.04);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    cursor:pointer;
  }

  .stage{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:24px;
  }

  .eyebrow{
    font-size:11px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--muted); margin-bottom:26px;
    opacity:0; animation: riseIn .8s cubic-bezier(.16,1,.3,1) .15s forwards;
  }

  .ring{
    width:56px; height:56px; border-radius:50%;
    border:1px solid var(--line);
    margin-bottom:34px;
    opacity:0; animation: riseIn .8s cubic-bezier(.16,1,.3,1) 0s forwards, spin 12s linear 1s infinite;
  }
  .ring::before{
    content:''; display:block; width:6px; height:6px; border-radius:50%;
    background:var(--ink); margin:6px auto 0;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  h1.title{
    font-family:'Newsreader', serif; font-weight:400; font-style:normal;
    font-size:clamp(2.1rem, 6vw, 3.4rem);
    letter-spacing:-0.01em; line-height:1.12; color:var(--ink);
    margin:0 0 12px;
    opacity:0; animation: riseIn .85s cubic-bezier(.16,1,.3,1) .3s forwards;
  }
  h1.title em{ font-style:italic; color:var(--muted); }

  .subtitle{
    font-size:13px; color:var(--muted); letter-spacing:.02em; margin-bottom:40px;
    opacity:0; animation: riseIn .8s cubic-bezier(.16,1,.3,1) .45s forwards;
  }

  .enter-btn{
    position:relative;
    padding:15px 38px;
    border:1px solid var(--ink);
    border-radius:999px;
    text-decoration:none; color:var(--ink);
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    background:transparent;
    opacity:0; animation: riseIn .8s cubic-bezier(.16,1,.3,1) .6s forwards;
    transition: background .35s cubic-bezier(.16,1,.3,1), color .35s, transform .35s cubic-bezier(.16,1,.3,1);
  }
  .enter-btn:hover{ background:var(--ink); color:#fff; transform: translateY(-1px); }
  .enter-btn:active{ transform: translateY(0); }

  .hint{
    margin-top:28px; font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(23,23,23,0.32);
    opacity:0; animation: riseIn .8s cubic-bezier(.16,1,.3,1) .75s forwards;
  }

  @keyframes riseIn{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }

  .leaving .stage{ animation: fadeOut .5s ease forwards; }
  @keyframes fadeOut{ to{ opacity:0; transform:scale(.96); } }
  .flash{ position:fixed; inset:0; background:var(--bg); opacity:0; pointer-events:none; z-index:20; }
  .leaving .flash{ animation: flashIn .55s ease forwards .15s; }
  @keyframes flashIn{ to{ opacity:1; } }

  @media (prefers-reduced-motion: reduce){
    .ring, .enter-btn, .eyebrow, .title, .subtitle, .hint{ animation: none !important; opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body id="body">

<div class="stage">
  <span class="eyebrow">Portfolio</span>

  <div class="ring"></div>

  <h1 class="title">Khianne Ed Miguel<br><em>P. Orteza</em></h1>
  <p class="subtitle">Bioengineering &middot; Microbiology &middot; Molecular Diagnostics</p>

  <a href="khianne-orteza-portfolio.html" class="enter-btn" id="enterBtn">View Portfolio</a>

  <span class="hint">click to continue</span>
</div>

<div class="flash"></div>

<script>
  const btn = document.getElementById('enterBtn');
  const body = document.getElementById('body');
  btn.addEventListener('click', function(e){
    e.preventDefault();
    const href = btn.getAttribute('href');
    body.classList.add('leaving');
    setTimeout(() => { window.location.href = href; }, 620);
  });
</script>
</body>
</html>
